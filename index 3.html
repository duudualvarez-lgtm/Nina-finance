const API=(()=>{
  let tok=null;try{tok=localStorage.getItem('cnTok');if(window.__WS&&localStorage.getItem('cnTokWs')!==window.__WS.code)tok=null}catch(e){}
  const rid=()=>{const a=new Uint8Array(15);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('')};
  async function req(method,url,body){
    let r;try{r=await fetch(url,{method,headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:body===undefined?undefined:JSON.stringify(body)})}
    catch(e){throw new Error('Sem internet. Confira a conexão e tente de novo.')}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error(j.error||('Erro '+r.status));e.status=r.status;if(r.status===401&&tok&&!url.startsWith('/api/login')){setTok(null);location.reload()}throw e}
    return j}
  function setTok(t,code){tok=t;try{if(t){localStorage.setItem('cnTok',t);if(code)localStorage.setItem('cnTokWs',code)}else{localStorage.removeItem('cnTok');localStorage.removeItem('cnTokWs')}}catch(e){}}
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const cols=new Map(),docs=new Map();let es=null,opened=false;
  const mkDoc=(id,d)=>({id,exists:true,data:()=>d});
  function colSnap(c,changes){const arr=[...c.map].map(([id,d])=>mkDoc(id,d));return{docs:arr,size:arr.length,empty:!arr.length,docChanges:()=>changes||arr.map(x=>({type:'added',doc:x}))}}
  function docSnap(id,d){return{id,exists:!!d,data:()=>d||undefined}}
  const fire=(set,s)=>set.forEach(l=>{try{l.ok(s)}catch(e){console.error(e)}});
  function apply(ev){
    const c=cols.get(ev.col);
    if(c&&c.loaded){const had=c.map.has(ev.id),old=c.map.get(ev.id);
      if(ev.op==='del'){if(had){c.map.delete(ev.id);fire(c.ls,colSnap(c,[{type:'removed',doc:mkDoc(ev.id,old)}]))}}
      else if(!had||!eq(old,ev.data)){c.map.set(ev.id,ev.data);fire(c.ls,colSnap(c,[{type:had?'modified':'added',doc:mkDoc(ev.id,ev.data)}]))}}
    const d=docs.get(ev.path);
    if(d&&d.loaded){const nd=ev.op==='del'?null:ev.data;if(!eq(d.data,nd)){d.data=nd;fire(d.ls,docSnap(ev.id,nd))}}}
  async function loadCol(path,c){try{const r=await req('GET','/api/col?path='+encodeURIComponent(path));
      const next=new Map(r.docs.map(x=>[x.id,x.data]));
      if(!c.loaded){c.map=next;c.loaded=true;fire(c.ls,colSnap(c))}
      else{const id0=path;for(const [id,d] of next)apply({path:path+'/'+id,col:id0,id,op:'set',data:d});for(const id of [...c.map.keys()])if(!next.has(id))apply({path:path+'/'+id,col:id0,id,op:'del'})}
    }catch(e){c.ls.forEach(l=>l.err&&l.err(e))}}
  async function loadDoc(path,d){try{const r=await req('GET','/api/doc?path='+encodeURIComponent(path));const id=path.split('/').pop();
      if(!d.loaded||!eq(d.data,r.data)){d.data=r.data;d.loaded=true;fire(d.ls,docSnap(id,r.data))}}catch(e){d.ls.forEach(l=>l.err&&l.err(e))}}
  function connect(){
    if(es)return;es=new EventSource('/api/stream?token='+encodeURIComponent(tok));
    es.onmessage=m=>{try{apply(JSON.parse(m.data))}catch(e){}};
    es.onopen=()=>{if(opened){cols.forEach((c,p)=>loadCol(p,c));docs.forEach((d,p)=>loadDoc(p,d))}opened=true};
  }
  const sp=p=>p.split('/').filter(Boolean);
  const docRef=path=>{const s=sp(path);return{id:s[s.length-1],path,
    onSnapshot(ok,err){let d=docs.get(path);if(!d){d={ls:new Set(),loaded:false,data:null};docs.set(path,d)}const l={ok,err};d.ls.add(l);if(d.loaded)ok(docSnap(this.id,d.data));else loadDoc(path,d);return()=>d.ls.delete(l)},
    async get(){const r=await req('GET','/api/doc?path='+encodeURIComponent(path));return docSnap(this.id,r.data)},
    async set(data){await req('PUT','/api/doc?path='+encodeURIComponent(path),{op:'set',data})},
    async update(data){await req('PUT','/api/doc?path='+encodeURIComponent(path),{op:'update',data})},
    async delete(){await req('DELETE','/api/doc?path='+encodeURIComponent(path))}}};
  const colRef=path=>({path,
    doc(id){return docRef(path+'/'+(id||rid()))},
    async add(data){const r=docRef(path+'/'+rid());await r.set(data);return r},
    onSnapshot(ok,err){let c=cols.get(path);if(!c){c={ls:new Set(),loaded:false,map:new Map()};cols.set(path,c)}const l={ok,err};c.ls.add(l);if(c.loaded)ok(colSnap(c));else loadCol(path,c);return()=>c.ls.delete(l)}});
  return{req,setTok,connect,get tok(){return tok},db:{collection:colRef,doc:docRef}}
})();

const TRK={id:null,wid:null,buf:[],last:null,lastSent:0,t:null,wl:null};
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),x=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
async function trkFlush(){if(!TRK.id||!TRK.buf.length)return;const pts=TRK.buf.splice(0,200),id=TRK.id;try{await API.req('POST','/api/track',{entryId:id,pts:pts.map(p=>({t:p[0],lat:p[1],lng:p[2],acc:p[3]}))})}catch(e){if(TRK.id===id)TRK.buf.unshift(...pts)}}

function trkSync(eid){
  if(eid===TRK.id)return;
  if(TRK.id){trkFlush();if(TRK.wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TRK.wid);clearInterval(TRK.t);try{TRK.wl&&TRK.wl.release()}catch(e){}TRK.wl=null;TRK.wid=null}
  TRK.id=eid||null;TRK.buf=[];TRK.last=null;

function period(k,o){const n=new Date();let a,b,bk=[];
  const days=(a,b)=>{const r=[];for(let d=new Date(a);d<b;d.setDate(d.getDate()+1)){const e=new Date(d);e.setDate(e.getDate()+1);r.push({l:String(d.getDate()),a:+d,b:+e})}return r};
  if(k==='dia'){a=sod(n);a.setDate(a.getDate()+o);b=new Date(a);b.setDate(b.getDate()+1)}
  else if(k==='semana'){a=weekStart(n);a.setDate(a.getDate()+7*o);b=new Date(a);b.setDate(b.getDate()+7);bk=days(a,b).map(x=>({...x,l:new Date(x.a).toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)+' '+new Date(x.a).getDate()}))}
  else if(k==='quinzena'){const i=n.getFullYear()*24+n.getMonth()*2+(n.getDate()>15?1:0)+o,y=Math.floor(i/24),m=Math.floor((i%24)/2),h=i%2;a=new Date(y,m,h?16:1);b=h?new Date(y,m+1,1):new Date(y,m,16);bk=days(a,b)}

  else{const y=n.getFullYear()+o;a=new Date(y,0,1);b=new Date(y+1,0,1);for(let m=0;m<12;m++)bk.push({l:'JFMAMJJASOND'[m],a:+new Date(y,m,1),b:+new Date(y,m+1,1)})}

    case 'pAddOpen':S.padd=S.padd===id?null:id;rerender();break;
    case 'pMore':(S.pmore=S.pmore||{})[id]=!S.pmore[id];rerender();break;
    case 'pAddSave':{const g=x=>document.getElementById(x+id),hs=g('pah_'),dd=g('pad_'),a=g('pas_'),z=g('pae_');if(!hs||!hs.value||!dd.value||!a.value||!z.value){$('#msg').textContent='Preencha a casa, o dia, a entrada e a saída.';return}
      const st=new Date(dd.value+'T'+a.value).getTime(),en=new Date(dd.value+'T'+z.value).getTime();
      if(!(en>st)){$('#msg').textContent='A saída tem que ser depois da entrada.';return}
      if(en-st>16*3600000){$('#msg').textContent='Isso dá mais de 16h de trabalho. Confira as horas.';return}
      if(st>Date.now()+60000){$('#msg').textContent='Esse dia ainda não chegou.';return}
      const hx=S.houses[hs.value],nm=(S.workers[id]||{}).name||'';
      run(async()=>{await db.collection('clock/'+id+'/entries').add({houseId:hs.value,houseName:hx.name,start:st,end:en,byAdmin:true});S.padd=null;S.pshow=S.pshow||{};S.pshow[id]=true;rerender();flash('Dia de '+nm+' salvo ✓ ('+fmtH((en-st)/3600000)+')')});break}
    case 'pToggle':(S.pshow=S.pshow||{})[id]=!S.pshow[id];rerender();break
    case 'pRow':S.pedit=S.pedit===id?null:id;S.pdel=null;rerender();break
    case 'pDel1':S.pdel=id+'/'+v;rerender();break;
    case 'pDelNo':S.pdel=null;rerender();break;
    case 'pDel2':{S.pdel=null;const nm=(S.workers[id]||{}).name||'';run(async()=>{await db.doc('clock/'+id+'/entries/'+v).delete();flash('Registro de '+nm+' apagado ✓')});rerender();break}
    case 'pIn':{const sel=document.getElementById('ph_'+id),ti=document.getElementById('pt_'+id);if(!sel||!sel.value)return;
      const ms=ti&&ti.value?new Date(ti.value).getTime():Date.now();
      if(ms>Date.now()+60000){$('#msg').textContent='Essa hora ainda não chegou. Confira a hora da entrada.';return}
      if(Date.now()-ms>LIM){$('#msg').textContent='A entrada foi há mais de 12h. Confira a data e a hora.';return}
      const hx=S.houses[sel.value],nm=(S.workers[id]||{}).name||'';
      run(async()=>{await db.collection('clock/'+id+'/entries').add({houseId:sel.value,houseName:hx.name,start:ms,end:null,byAdmin:true});flash('Entrada de '+nm+' registrada ✓')});break}
    case 'pOut':{const to=document.getElementById('po_'+id),e=(S.entries[id]||{})[v];if(!e)return;
      const ms=to&&to.value?new Date(to.value).getTime():Date.now();
      if(ms>Date.now()+60000){$('#msg').textContent='Essa hora ainda não chegou. Confira a hora da saída.';return}
      if(ms<=e.start){$('#msg').textContent='A saída tem que ser depois da entrada ('+fmtT(e.start)+').';return}
      if(ms-e.start>LIM){$('#msg').textContent='Isso dá mais de 12h de trabalho. Confira a hora da saída.';return}
      const nm=(S.workers[id]||{}).name||'';
      run(async()=>{await db.doc('clock/'+id+'/entries/'+v).update({end:ms,auto:false});flash('Saída de '+nm+' registrada ✓')});break}
    case 'out':run(async()=>{const lp=getLoc(),ref=db.doc('clock/'+uid+'/entries/'+id);await ref.update({end:Date.now()});tagLoc(ref,'outLoc',lp)});break;
    case 'switch':{const sel=$('#wh'),hid=sel.value||(sel.options[0]||{}).value,hs=S.houses[hid],lp=getLoc();run(async()=>{const n=Date.now(),old=db.doc('clock/'+uid+'/entries/'+id);await old.update({end:n});const nw=await db.collection('clock/'+uid+'/entries').add({houseId:hid,houseName:hs.name,start:n,end:null});tagLoc(old,'outLoc',lp);tagLoc(nw,'inLoc',lp)})}break;
    case 'pay':run(async()=>{const np=(S.fin[id]||{}).status!=='pago';await db.doc('finance/'+id).update({status:np?'pago':'pendente',paidAt:Date.now()});await db.doc('houses/'+id).update({active:!np})});break;
    case 'active':run(()=>db.doc('houses/'+id).update({active:!S.houses[id].active}));break;
  }
});
const SAVEABLE=new Set(['eHouse','eStart','eEnd','chk','paidAt','sdate','mDate','merge','hb','hr','ex','value','pct','rate','legal']);
function dkey(t){const d=t.dataset;return d.chg+'|'+(d.id||'')+'|'+(d.w||'')+'|'+(d.chg==='chk'?S.co:'')}
function savBtn(dk){const w=document.createElement('span');w.className='svw';w.dataset.dk=dk;w.innerHTML='<button class="p sv" data-act="saveDraft" data-dk="'+dk.replace(/"/g,'&quot;')+'">Salvar</button><button class="sv2" data-act="cancelDraft" data-dk="'+dk.replace(/"/g,'&quot;')+'">Cancelar</button>';return w}
function showSave(el,dk){document.querySelectorAll('.svw').forEach(x=>{if(x.dataset.dk===dk)x.remove()});el.classList.add('dirty');el.insertAdjacentElement('afterend',savBtn(dk))}
function applyDrafts(){const D=S.draft;if(!D)return;document.querySelectorAll('#app [data-chg]').forEach(el=>{if(!SAVEABLE.has(el.dataset.chg))return;const dk=dkey(el);if(dk in D){el.value=D[dk].v;showSave(el,dk)}})}
function stage(t){const k=t.dataset.chg;if(!k||!isOwner||!SAVEABLE.has(k))return false;const dk=dkey(t);(S.draft=S.draft||{})[dk]={k,id:t.dataset.id,w:t.dataset.w,v:t.value};
  if(!document.querySelector('.svw[data-dk="'+dk.replace(/"/g,'\\"')+'"]'))showSave(t,dk);return true}
function applyChange(t){
  const k=t.dataset.chg,id=t.dataset.id,w=t.dataset.w,v=+t.value||0;
  if(k==='eHouse')return run(()=>db.doc('clock/'+w+'/entries/'+id).update({houseId:t.value,houseName:S.houses[t.value].name}));
  if(k==='eStart'||k==='eEnd'){const ms=t.value?new Date(t.value).getTime():null;if(k==='eStart'&&!ms)return Promise.resolve(false);
    return run(async()=>{const old=S.entries[w][id],ref=db.doc('clock/'+w+'/entries/'+id);
      if(k==='eStart'){const prev=Object.entries(S.entries[w]).find(([pid,p])=>pid!==id&&p.end===old.start);
        if(prev)await db.doc('clock/'+w+'/entries/'+prev[0]).update({end:ms});
        await ref.update({start:ms,...((old.manual&&old.end)?{hours:Math.round((old.end-ms)/36e5*100)/100}:{})})}
      else await ref.update({end:ms,auto:false,...((old.manual&&ms&&ms>old.start)?{hours:Math.round((ms-old.start)/36e5*100)/100}:{})})})}
  if(k==='chk'){const ws=weekStart(new Date());ws.setDate(ws.getDate()+7*S.co);const key='chk_'+id+'_'+(+ws);
    if(t.value==='')return run(()=>db.doc('finance/'+key).delete());return run(()=>db.doc('finance/'+key).set({amount:+t.value,manual:true}))}
  if(k==='paidAt'){if(!t.value)return Promise.resolve(false);return run(()=>db.doc('finance/'+id).update({paidAt:new Date(t.value+'T12:00:00').getTime()}))}
  if(k==='sdate')return run(()=>db.doc('houses/'+id).update({startDate:t.value?new Date(t.value+'T00:00:00').getTime():null}));
  if(k==='mDate'){if(!t.value)return Promise.resolve(false);return run(async()=>{const e=S.entries[w][id],st=new Date(t.value+'T08:00:00').getTime();await db.doc('clock/'+w+'/entries/'+id).update({start:st,end:st+e.hours*3600000})})}
  if(k==='merge'){if(!t.value)return Promise.resolve(false);const to=t.value;return run(async()=>{const src=S.entries[id]||{};for(const eid in src)await db.collection('clock/'+to+'/entries').add(src[eid]);for(const eid in src)await db.doc('clock/'+id+'/entries/'+eid).delete();await db.doc('rates/'+to).set({...(S.rates[id]||{}),...(S.rates[to]||{})});await db.doc('rates/'+id).delete();await db.doc('clock/'+id).delete()})}
  if(k==='hb'||k==='hr'||k==='ex'){const f=S.fin[id]||{},cr=coRate((S.houses[id]||{}).company),n={hrsBudget:f.hrsBudget??null,hrRate:f.hrRate??cr,extra:f.extra||0};
    if(k==='hb')n.hrsBudget=t.value===''?null:v;if(k==='hr')n.hrRate=v||cr;if(k==='ex')n.extra=v;
    n.value=f.real?f.value:(n.hrsBudget==null?null:Math.round((n.hrsBudget*n.hrRate+n.extra)*100)/100);
    return run(()=>db.doc('finance/'+id).update(n))}
  if(k==='value')return run(()=>db.doc('finance/'+id).update({value:t.value===''?null:v}));
  if(k==='pct')return run(()=>db.doc('finance/'+id).update({pct:v}));
  if(k==='rate')return run(()=>db.doc('rates/'+id).set({...(S.rates[id]||{}),rate:v}));
  if(k==='legal')return run(()=>db.doc('rates/'+id).set({...(S.rates[id]||{}),legalName:t.value.trim()}));
  return Promise.resolve(false)}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.chg&&t.tagName!=='SELECT')stage(t)});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act="saveDraft"],[data-act="cancelDraft"]');if(!b)return;e.stopPropagation();
  const dk=b.dataset.dk,d=S.draft&&S.draft[dk];if(!d)return;
  if(b.dataset.act==='cancelDraft'){delete S.draft[dk];rerender();return}
  b.disabled=true;b.textContent='Salvando…';
  const ok=await applyChange({value:d.v,dataset:{chg:d.k,id:d.id,w:d.w}});
  if(ok){delete S.draft[dk];flash('Salvo ✓');rerender()}else{b.disabled=false;b.textContent='Salvar'}
},true);
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.chg;if(!k||!isOwner)return;
  if(SAVEABLE.has(k)){stage(t);return}
  if(k==='jump'){const v=t.value;if(!v)return;const n=new Date();let o=0;
    if(S.pk==='mes'){const [y,m]=v.split('-').map(Number);o=(y-n.getFullYear())*12+(m-1-n.getMonth())}
    else if(S.pk==='ano'){o=+v-n.getFullYear()}
    else{const d=new Date(v+'T12:00:00');if(S.pk==='dia')o=Math.round((sod(d)-sod(n))/DAY);
      else if(S.pk==='semana')o=Math.floor((+weekStart(d)-+weekStart(n))/(7*DAY)+0.5);
      else o=(d.getFullYear()*24+d.getMonth()*2+(d.getDate()>15?1:0))-(n.getFullYear()*24+n.getMonth()*2+(n.getDate()>15?1:0))}
    S.po=o;render()}
  else if(k==='hjump'){const v=t.value;if(!v)return;const n=new Date();let o=0;
    if(S.hk==='mes'){const [y,m]=v.split('-').map(Number);o=(y-n.getFullYear())*12+(m-1-n.getMonth())}
    else if(S.hk==='ano')o=+v-n.getFullYear();
    else o=Math.floor((+weekStart(new Date(v+'T12:00:00'))-+weekStart(n))/(7*DAY)+0.5);
    S.ho=o;render()}
});
</script></body></html>
